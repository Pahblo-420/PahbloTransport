<div id="quoteModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Get a Monthly Quote Estimate</h2>
        <p>Fill in your details for an instant monthly estimate.</p>
        
        <form id="quoteForm" action="YOUR_FORMSPREE_LINK_HERE" method="POST">
            <input type="text" name="parentName" placeholder="Parent/Guardian Name" required>
            <input type="tel" name="phone" placeholder="WhatsApp/Phone Number" required>
            <input type="text" name="schoolName" placeholder="School Name" required>

            <label for="tripType">Type of Service:</label>
            <select id="tripType" name="tripType" required>
                <option value="twoway">Two-way (Morning & Afternoon)</option>
                <option value="oneway">One-way (Morning OR Afternoon only)</option>
            </select>

            <label for="distance">Estimated Distance (Home to School):</label>
            <select id="distance" name="distance" required>
                <option value="local">Nearby (Under 5km)</option>
                <option value="medium">Medium (5km - 15km)</option>
                <option value="far">Far (Over 15km)</option>
            </select>

            <label for="learners">Number of Learners (Siblings):</label>
            <select id="learners" name="learners" required>
                <option value="1">1 Learner</option>
                <option value="2">2 Learners (10% Discount)</option>
                <option value="3">3+ Learners (15% Discount)</option>
            </select>

            <button type="submit" class="btn primary">Calculate & Send Request</button>
            <p id="quoteResult" style="margin-top: 15px; font-weight: bold;"></p>
        </form>
    </div>
</div>
